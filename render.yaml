services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. FastAPI Web Service (API + health endpoints)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: vyom-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    plan: free           # Upgrade to 'starter' for 24/7 uptime (no sleep)
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000

      # ── MongoDB Atlas ──────────────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false      # Paste your Atlas connection string in Render Dashboard

      - key: MONGODB_DATABASE
        value: vyom

      # ── Bot mode: MUST be 'polling' so the API process does NOT also poll ──
      # The actual polling is handled by the vyom-bot background worker below.
      # Set to 'webhook' only if you configure a webhook endpoint separately.
      - key: BOT_MODE
        value: polling

      - key: TELEGRAM_BOT_TOKEN
        sync: false      # Your bot token from @BotFather — set in Render Dashboard

      - key: BOT_USERNAME
        sync: false      # e.g. VyomShopBot (without @)

      # ── Background worker embedded in API process ──────────────────────────
      # Keep 'true' so the APScheduler (udhaar/opportunity jobs) runs inside
      # the API container (avoids needing a third service on the free plan).
      - key: RUN_WORKER_IN_API
        value: "true"

      # ── AI configuration ───────────────────────────────────────────────────
      - key: AI_MODE
        value: mock      # Change to 'live' when SARVAM_API_KEY / GEMINI_API_KEY are set

      - key: DEMO_MODE
        value: "true"

      # ── Security ───────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true

      # ── CORS / Frontend ────────────────────────────────────────────────────
      - key: WEB_ORIGIN
        sync: false      # e.g. https://vyom-web.onrender.com

      - key: PUBLIC_API_URL
        sync: false      # e.g. https://vyom-api.onrender.com

      # ── Optional AI providers ──────────────────────────────────────────────
      - key: SARVAM_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Telegram Bot — Background Worker (long-polling)
  #
  # WHY a separate Background Worker?
  #   • Render "web" services sleep after 15 min of no HTTP traffic on the free
  #     plan — this kills long-polling.  Background Workers NEVER sleep.
  #   • A separate process isolates bot crashes from the API.
  #   • uvicorn's multi-worker mode is incompatible with embedded polling
  #     (causes Telegram 409 Conflict). Background Worker sidesteps this.
  # ─────────────────────────────────────────────────────────────────────────────
  - type: worker
    name: vyom-bot
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.bot
    dockerContext: .
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false      # Same Atlas URI as the API service

      - key: MONGODB_DATABASE
        value: vyom

      - key: TELEGRAM_BOT_TOKEN
        sync: false      # Same token as the API service

      - key: BOT_USERNAME
        sync: false

      - key: BOT_MODE
        value: polling

      - key: AI_MODE
        value: mock

      - key: DEMO_MODE
        value: "true"

      - key: PUBLIC_API_URL
        sync: false      # Needed by any handler that builds callback URLs

      - key: SARVAM_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: JWT_SECRET
        sync: false      # Should match the API's JWT_SECRET for token validation

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Merchant PWA Frontend (Static Site — always free on Render)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: vyom-web
    runtime: static
    rootDir: apps/web
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: PUBLIC_API_URL
        sync: false      # e.g. https://vyom-api.onrender.com
