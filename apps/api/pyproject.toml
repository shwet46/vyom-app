[project]
name = "vyom"
version = "0.1.0"
description = "VYOM Backend - AI Business Partner for Paytm Merchants"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pymongo[srv]>=4.8.0",
    "structlog>=24.4.0",
    "pyjwt>=2.9.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "qrcode[pil]>=7.4.0",
    "pywebpush>=2.0.0",
    "rapidfuzz>=3.9.0",
    "pillow>=10.4.0",
    "aiogram>=3.13.0",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vyom"]
