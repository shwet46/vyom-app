<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vyomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2597d0" />
      <stop offset="100%" stop-color="#1479ab" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#103784" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background with smooth squircle -->
  <rect width="512" height="512" rx="128" fill="url(#vyomGrad)" />
  <!-- Radar pulse subtle ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#d7e6f5" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2" />
  <!-- Central Icon: Modern Geometric 'V' embodying Growth and Rupee / Recovery -->
  <g filter="url(#softGlow)">
    <path d="M148 160 L256 376 L364 160" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rupee top crossbar in sky/white -->
    <line x1="168" y1="210" x2="344" y2="210" stroke="#d7e6f5" stroke-width="28" stroke-linecap="round" />
    <!-- AI sparkle beacon at center -->
    <circle cx="256" cy="286" r="14" fill="#ffffff" />
  </g>
</svg>
