<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYOM - Offline Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap">
  <style>
    body {
      font-family: 'Instrument Sans', 'Noto Sans', system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(160deg, #faf9f6 0%, #fff7e6 50%, #fff0e8 100%);
      color: #171a2b;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 17px 37px rgba(23, 26, 43, 0.14);
      max-width: 400px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: #fff1c9;
      color: #d97706;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 16px;
    }
    h1 { font-family: 'Instrument Sans', 'Noto Sans', sans-serif; font-size: 24px; margin: 0 0 12px; }
    p { color: #6b7280; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button {
      background: #f59e0b;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Hai</div>
    <h1>Internet Connection Nahi Hai</h1>
    <p>Aapka data surakshit hai. Internet aane par Vyom automatic sync ho jayega.</p>
    <button onclick="window.location.reload()">Dobaara Koshish Karein</button>
  </div>
</body>
</html>
