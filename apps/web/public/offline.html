<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYOM - Offline Mode</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f5f5f5;
      color: #070709;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 17px 37px rgba(16, 55, 132, 0.05);
      max-width: 400px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: #d7e6f5;
      color: #2597d0;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #60606c; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button {
      background: #2597d0;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Hai</div>
    <h1>Internet Connection Nahi Hai</h1>
    <p>Aapka data surakshit hai. Internet aane par Vyom automatic sync ho jayega.</p>
    <button onclick="window.location.reload()">Dobaara Koshish Karein</button>
  </div>
</body>
</html>
